<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraNotifier — Launching Roblox Server</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 15%, #181c2e 0%, #0a0c14 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(22, 26, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(6, 182, 212, 0.12);
      backdrop-filter: blur(12px);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 14px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      padding: 18px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
      border: none;
      width: 100%;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>Launching Roblox Server</h1>
    <p>Connecting you directly to verified solo server...</p>

    <button class="btn" id="openBtn" onclick="launchGame()">
      <span>🎮 Launch Roblox Directly</span>
    </button>

    <div class="hint">Click <b>Allow / Open</b> if your browser prompts.</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('jobId') || urlParams.get('gameId') || '';
    const placeId = '107778070777162';

    const isAndroid = /android/i.test(navigator.userAgent);
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

    const protocolUrl = 'roblox://experiences/start?placeId=' + placeId + '&gameInstanceId=' + jobId;
    const androidIntentUrl = 'intent://experiences/start?placeId=' + placeId + '&gameInstanceId=' + jobId + '#Intent;scheme=roblox;package=com.roblox.client;end';

    function getTargetUrl() {
      if (isAndroid) {
        return androidIntentUrl;
      }
      return protocolUrl;
    }

    function launchGame() {
      const target = getTargetUrl();
      window.location.href = target;

      if (isAndroid) {
        setTimeout(() => {
          window.location.href = protocolUrl;
        }, 500);
      }
    }

    // Auto-launch attempt on initial load
    try {
      launchGame();
    } catch (e) {
      console.log('Auto-launch blocked by WebView, waiting for user tap');
    }

    // Auto-close page on PC after successful protocol launch
    if (!isAndroid && !isIOS) {
      setTimeout(() => {
        window.close();
      }, 1500);
    }
  </script>
</body>
</html>
