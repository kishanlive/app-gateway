<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AuraNotifier — Launching Roblox</title>

  <!-- ⚡ INSTANT LAUNCH ENGINE: Microsecond execution in <head> -->
  <script>
    (function() {
      var p = new URLSearchParams(window.location.search);
      var jobId = p.get('jobId') || p.get('gameId') || '';
      var placeId = '107778070777162';
      if (!jobId) return;

      var isAndroid = /android/i.test(navigator.userAgent);
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      var protocolUrl = 'roblox://experiences/start?placeId=' + placeId + '&gameInstanceId=' + encodeURIComponent(jobId);
      var androidIntent = 'intent://experiences/start?placeId=' + placeId + '&gameInstanceId=' + encodeURIComponent(jobId) + '#Intent;scheme=roblox;package=com.roblox.client;end';

      window.__targetUrl = isAndroid ? androidIntent : protocolUrl;
      window.__fallbackUrl = protocolUrl;
      window.__jobId = jobId;

      // BroadcastChannel: close or dismiss older tabs when a new one opens
      try {
        if ('BroadcastChannel' in window) {
          var bc = new BroadcastChannel('auranotifier_gateway');
          bc.postMessage({ action: 'new_launch', time: Date.now() });
          bc.onmessage = function(e) {
            if (e.data && e.data.action === 'new_launch') {
              tryCloseTab();
              document.title = 'Old Session Closed';
              document.body.innerHTML = '<div style="color:#64748b;padding:40px;font-family:sans-serif;text-align:center;"><h2>Old Session Finished</h2><p style="margin-top:10px;">A newer Roblox server was launched. You can close this tab.</p></div>';
            }
          };
        }
      } catch (err) {}

      // Immediate launch execution
      try {
        window.location.replace(window.__targetUrl);
      } catch (e) {
        try { window.location.href = window.__targetUrl; } catch (e2) {}
      }

      // Android dual-dispatch fallback
      if (isAndroid) {
        setTimeout(function() {
          try { window.location.href = protocolUrl; } catch (e) {}
        }, 350);
      }
    })();

    function tryCloseTab() {
      try { window.open('', '_self', ''); window.close(); } catch (e) {}
      try { window.close(); } catch (e) {}
      try { self.close(); } catch (e) {}
      try { window.top.close(); } catch (e) {}
      try {
        if (window.history.length > 1) {
          window.history.back();
        }
      } catch (e) {}
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 15%, #181c2e 0%, #0a0c14 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: rgba(22, 26, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(6, 182, 212, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .icon {
      font-size: 52px;
      margin-bottom: 12px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 21px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 20px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      border: none;
      width: 100%;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-launch {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
    }
    .btn-close {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-close:hover {
      background: rgba(239, 68, 68, 0.25);
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
    .hint b { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1 id="titleText">Roblox Launched!</h1>
    <p id="subText">Connecting you to verified solo server...</p>
    <div class="badge" id="jobBadge">Instance: #Connecting...</div>

    <div class="btn-group">
      <button class="btn btn-launch" id="openBtn" onclick="launchGame()">
        <span>🎮 Re-open Roblox</span>
      </button>
      <button class="btn btn-close" id="closeBtn" onclick="manualClose()">
        <span>✕ Close This Tab</span>
      </button>
    </div>

    <div class="hint">Mobile & PC • You can safely close this browser tab anytime.</div>
  </div>

  <script>
    var badge = document.getElementById('jobBadge');
    if (badge && window.__jobId) {
      badge.textContent = 'Server: #' + window.__jobId.slice(0, 8) + ' (Solo)';
    }

    function launchGame() {
      var target = window.__targetUrl;
      if (!target) {
        var p = new URLSearchParams(window.location.search);
        var j = p.get('jobId') || p.get('gameId') || '';
        target = 'roblox://experiences/start?placeId=107778070777162&gameInstanceId=' + encodeURIComponent(j);
      }
      window.location.href = target;
      if (/android/i.test(navigator.userAgent) && window.__fallbackUrl) {
        setTimeout(function() {
          window.location.href = window.__fallbackUrl;
        }, 350);
      }
    }

    function manualClose() {
      tryCloseTab();
      // If browser blocked close, update text clearly
      document.getElementById('titleText').textContent = '✅ You can close this tab';
      document.getElementById('subText').textContent = 'Roblox is opening. Switch to the Roblox app now!';
    }

    // Auto-close on blur when switching to Roblox
    window.addEventListener('blur', function() {
      setTimeout(function() {
        tryCloseTab();
      }, 400);
    });

    // Auto-close when page hides (e.g. Android app switch or tab backgrounded)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        tryCloseTab();
      }
    });

    // Mobile in-app / webview auto-close attempt
    if (/android|iphone|ipad|ipod/i.test(navigator.userAgent)) {
      setTimeout(function() {
        tryCloseTab();
      }, 1200);
    } else {
      // PC auto-close attempt after protocol dispatch
      setTimeout(function() {
        tryCloseTab();
      }, 1000);
    }
  </script>
</body>
</html>
